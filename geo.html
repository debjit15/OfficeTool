<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTag Pro: Precision Geotagging Tool</title>
    <link rel="icon" type="image/png" href="./Assets/icons/icon-256x256.png">

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" as="style">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Link to the new style.css and geo.css -->
    <link rel="stylesheet" href="./Assets/css/style.css">
    <link rel="stylesheet" href="./Assets/css/geo.css">

</head>

<body class="portrait-mode"> <!-- 'portrait-mode' class added here, will be toggled by JS -->

    <!-- Top Settings Bar -->
    <div id="topBar">
        <button id="flashBtn" title="Toggle Flash" class="icon-btn">
            <span class="material-symbols-outlined">flash_off</span>
        </button>
        <div class="top-center-tech">
            <span class="material-symbols-outlined">hdr_on</span>
            <span class="tech-text">AI CAM</span>
        </div>
        <button id="settingsBtn" title="App Settings" class="icon-btn">
            <span class="material-symbols-outlined">settings</span>
        </button>
    </div>

    <!-- Main Camera View -->
    <main>
        <div id="cameraContainer">
            <video id="cameraView" autoplay playsinline></video>
            <div id="flashOverlay"></div>

            <!-- Tech Overlay (Data Stamp) -->
            <div id="infoOverlay" class="tech-overlay">
                <div class="overlay-header">
                    <div class="overlay-badge">GPS MAP CAMERA</div>
                    <div id="overlayTime" class="overlay-time">--:--</div>
                </div>

                <div class="overlay-content">
                    <div class="overlay-map-container">
                        <div id="overlayMap"></div>
                    </div>
                    <div class="overlay-details">
                        <div class="detail-row location-row">
                            <span class="material-symbols-outlined icon-small">location_on</span>
                            <div id="overlayAddress">Fetching Location...</div>
                        </div>
                        <div class="detail-row coords-row">
                            <span class="material-symbols-outlined icon-small">explore</span>
                            <div id="overlayCoords">Lat: ---, Lng: ---</div>
                        </div>
                        <div class="detail-row user-row">
                            <img id="overlayUserPhoto" src="./Assets/icons/icon-256x256.png" alt="User"
                                class="user-avatar">
                            <div id="overlayUsername">Guest User</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Control Deck -->
    <div id="bottomDeck">
        <div class="deck-row secondary-controls">
            <button id="manualLocBtn" title="Set Location" class="icon-btn small-btn">
                <span class="material-symbols-outlined">edit_location</span>
            </button>
            <button id="fetchBtn" title="Refresh GPS" class="icon-btn small-btn">
                <span class="material-symbols-outlined">my_location</span>
            </button>
            <button id="logBtn" title="Logs" class="icon-btn small-btn">
                <span class="material-symbols-outlined">terminal</span>
            </button>
        </div>

        <div class="deck-row primary-controls">
            <button id="galleryBtn" class="gallery-preview">
                <!-- Image thumbnail will go here via JS usually, or icon -->
                <span class="material-symbols-outlined">photo_library</span>
            </button>

            <button id="captureBtn" class="shutter-btn" title="Capture">
                <div class="shutter-inner"></div>
            </button>

            <button id="rotateBtn" class="icon-btn switch-camera" title="Flip Camera">
                <span class="material-symbols-outlined">flip_camera_ios</span>
            </button>
        </div>
    </div>


    <div id="notificationContainer"></div>

    <div id="previewModal" class="hidden">
        <div class="module-content animate__animated">
            <button class="close-modal-btn absolute-close">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h2>Image Preview</h2>
            <div class="content-wrapper">
                <img id="previewImage" alt="Captured Geotagged Image">
            </div>
            <div class="action-buttons">
                <button id="retakeBtn" class="secondary-btn" title="Discard and Retake">
                    <span class="material-symbols-outlined">restart_alt</span> <span class="button-text">Retake</span>
                </button>
                <button id="saveBtn" class="primary-btn" title="Download Image File">
                    <span class="material-symbols-outlined">download</span> <span class="button-text">Save Image</span>
                </button>
            </div>
        </div>
    </div>

    <div id="manualLocationModule" class="hidden">
        <div class="module-content animate__animated">
            <h2>Manual Location Override</h2>
            <div id="manualMapPlaceholder"></div>

            <div class="manual-grid">
                <label>
                    <div class="text-sm font-medium mb-1">Latitude</div>
                    <input type="number" id="manualLatInput" step="0.000001" placeholder="e.g., 34.05223">
                </label>
                <label>
                    <div class="text-sm font-medium mb-1">Longitude</div>
                    <input type="number" id="manualLngInput" step="0.000001" placeholder="e.g., -118.24368">
                </label>
            </div>

            <div class="manual-grid">
                <label>
                    <div class="text-sm font-medium mb-1">Date</div>
                    <input type="date" id="manualDateInput">
                </label>
                <label>
                    <div class="text-sm font-medium mb-1">Time</div>
                    <input type="time" id="manualTimeInput">
                </label>
            </div>

            <div class="action-buttons mt-6">
                <button id="manualCancelBtn" class="secondary-btn" title="Close and use automatic GPS">
                    <span class="material-symbols-outlined">close</span> <span class="button-text">Cancel</span>
                </button>
                <button id="manualConfirmBtn" class="primary-btn" title="Apply manual location and timestamp">
                    <span class="material-symbols-outlined">check</span> <span class="button-text">Confirm
                        Location</span>
                </button>
            </div>
        </div>
    </div>

    <div id="logsModule" class="hidden">
        <div class="module-content">
            <h6>System Logs</h6>
            <div id="logs"></div>
            <button id="closeLogs" class="secondary-btn">Close Logs</button>
        </div>
    </div>

    <!-- New Settings Module -->
    <div id="settingsModule" class="hidden">
        <div class="module-content animate__animated">
            <button class="close-modal-btn absolute-close" id="settingsCloseX">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h2>App Settings</h2>
            <div class="settings-section">
                <h3>User Information</h3>
                <label>
                    Display Name:
                    <input type="text" id="settingDisplayName" placeholder="e.g., John Doe">
                </label>
                <label>
                    Photo URL (Optional):
                    <input type="url" id="settingPhotoURL" placeholder="https://example.com/me.jpg">
                </label>
                <p class="text-xs text-light-gray mt-1">Leave blank to use default avatar.</p>
            </div>
            <div class="action-buttons mt-6">
                <button id="settingsCancelBtn" class="secondary-btn">
                    <span class="material-symbols-outlined">close</span> <span class="button-text">Cancel</span>
                </button>
                <button id="settingsSaveBtn" class="primary-btn">
                    <span class="material-symbols-outlined">save</span> <span class="button-text">Save Settings</span>
                </button>
            </div>
        </div>
    </div>

    <!-- New Gallery Module -->
    <div id="galleryModule" class="hidden">
        <div class="module-content animate__animated">
            <button class="close-modal-btn absolute-close" id="galleryCloseX">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h2>Image Gallery</h2>
            <div id="galleryContent">
                <p class="text-light-gray">No images captured yet. Take a photo!</p>
            </div>
            <div class="action-buttons mt-6">
                <button id="galleryCloseBtn" class="secondary-btn">
                    <span class="material-symbols-outlined">close</span> <span class="button-text">Close Gallery</span>
                </button>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <!-- Make sure to update geo.js with the new orientation logic -->
    <script type="module" src="./Assets/geo.js"></script>

</body>

</html>
