<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Diary - Professional Edition</title>
  <meta name="description" content="A secure, real-time digital diary app with rich editing.">

  <!-- Favicon -->
  <link rel="icon" href="./Assets/favicon.ico" type="image/x-icon">

  <!-- Fonts & Icons -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&family=Roboto+Mono&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" rel="stylesheet">

  <!-- Libraries -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="./Assets/css/style.css" rel="stylesheet">
  <link href="./Assets/css/dairy.css" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>

<body class="theme-light">

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-glass fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="fas fa-book-open me-2"></i>Digital Diary
      </a>

      <div class="nav-actions d-flex align-items-center gap-2">
        <!-- Date Navigation -->
        <div class="date-nav">
          <button id="prevPageBtn" class="btn btn-sm btn-glass border-0" title="Previous Day">
            <i class="fas fa-chevron-left"></i>
          </button>
          <input type="date" id="datePicker" class="date-input">
          <button id="nextPageBtn" class="btn btn-sm btn-glass border-0" title="Next Day">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>

        <!-- Tools -->
        <button class="btn btn-glass" data-module="summary" title="Summary">
          <i class="fas fa-list-ul"></i>
        </button>

        <div class="dropdown">
          <button id="topActionsBtn" class="btn btn-glass" data-bs-toggle="dropdown">
            <i class="fas fa-ellipsis-v"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4">
            <li><button class="dropdown-item py-2" id="todayBtn"><i
                  class="fas fa-calendar-day me-2 text-primary"></i>Today</button></li>
            <li>
              <button class="dropdown-item py-2" id="saveBtn">
                <span class="me-2 text-success"><i class="fas fa-save save-icon"></i></span> Save Entry
              </button>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li><button class="dropdown-item py-2" data-module="settings"><i
                  class="fas fa-cog me-2"></i>Settings</button></li>
            <!-- Export/Print placeholders if logic exists, otherwise keeping UI clean -->
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container-main animate__animated animate__fadeIn">
    <div id="pagedEntryContent" class="content-card">
      <div id="editorToolbar" class="editor-toolbar">
        <!-- Quill toolbar configuration matches app.js expectations -->
        <span class="ql-formats">
          <select class="ql-header">
            <option value="1"></option>
            <option value="2"></option>
            <option selected></option>
          </select>
          <select class="ql-font">
            <option selected>Default</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
          </select>
        </span>
        <span class="ql-formats">
          <button class="ql-bold"></button><button class="ql-italic"></button><button class="ql-underline"></button>
          <select class="ql-color"></select>
          <select class="ql-background"></select>
        </span>
        <span class="ql-formats">
          <button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button>
          <button class="ql-clean"></button>
        </span>
      </div>

      <div id="editor"></div>
    </div>
  </main>

  <!-- Summary Modal -->
  <div class="modal fade" id="summaryModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold"><i class="fas fa-chart-pie me-2 text-primary"></i>Diary Summary</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3 mb-4">
            <div class="col-4 text-center">
              <h3 id="summaryTotalEntries" class="fw-bold text-primary mb-0">0</h3>
              <small class="text-muted">Entries</small>
            </div>
            <div class="col-4 text-center">
              <h3 id="summaryTotalWords" class="fw-bold text-success mb-0">0</h3>
              <small class="text-muted">Words</small>
            </div>
            <div class="col-4 text-center">
              <h3 id="summaryAvgWords" class="fw-bold text-info mb-0">0</h3>
              <small class="text-muted">Avg/Entry</small>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover" id="summaryTable">
              <thead class="table-light">
                <tr>
                  <th>Date</th>
                  <th>Words</th>
                  <th>Last Modified</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal fade" id="settingsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Settings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-4">
            <label class="form-label fw-bold">Theme</label>
            <div class="d-flex gap-2">
              <input type="radio" class="btn-check" name="theme" id="lightTheme" value="light" checked>
              <label class="btn btn-outline-primary flex-fill" for="lightTheme"><i class="fas fa-sun me-1"></i>
                Light</label>

              <input type="radio" class="btn-check" name="theme" id="darkTheme" value="dark">
              <label class="btn btn-outline-dark flex-fill" for="darkTheme"><i class="fas fa-moon me-1"></i>
                Dark</label>

              <input type="radio" class="btn-check" name="theme" id="sepiaTheme" value="sepia">
              <label class="btn btn-outline-warning flex-fill" for="sepiaTheme"><i class="fas fa-book me-1"></i>
                Sepia</label>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">Font Style</label>
            <select class="form-select" id="fontSelect">
              <option value="Poppins">Poppins (Clean)</option>
              <option value="Merriweather">Merriweather (Classic)</option>
              <option value="Roboto Mono">Roboto Mono (Code)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Font Size <span id="fontSizeValue"
                class="badge bg-secondary ms-2">16px</span></label>
            <input type="range" class="form-range" id="fontSizeRange" min="12" max="24" value="16">
          </div>

          <div class="mb-2">
            <label class="form-label fw-bold">Auto-save (seconds)</label>
            <input type="number" class="form-control" id="autoSaveInterval" value="30">
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-primary w-100 apply-settings rounded-pill">Apply Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay">
    <div class="spinner-border text-primary mb-3" role="status"></div>
    <div class="fw-bold">Loading your diary...</div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script type="module" src="./Assets/app.js"></script>
</body>

</html>
