<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - GeoTag Pro</title>

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="./Assets/icons/icon-256x256.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./Assets/icons/icon-256x256.png">

    <!-- Bootstrap & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./Assets/css/style.css">

    <style>
        .profile-header {
            background: var(--surface-color);
            padding: 3rem 1rem;
            text-align: center;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        #profilePagePhoto {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: var(--shadow-md);
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }

        .activity-card {
            background: var(--surface-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            height: 100%;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-chevron-left me-2"></i>Back to Home
            </a>
        </div>
    </nav>

    <!-- Profile Header -->
    <div class="profile-header">
        <div class="container">
            <img id="profilePagePhoto" src="./Assets/icons/icon-256x256.png" alt="User">
            <h2 id="profilePageName" class="fw-bold mb-1 position-relative z-1">Guest User</h2>
            <p id="profilePageEmail" class="text-secondary position-relative z-1">guest@example.com</p>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row g-4">
            <!-- Account Details -->
            <div class="col-md-4">
                <div class="activity-card">
                    <h5 class="fw-bold mb-3"><i class="fas fa-user-shield me-2 text-primary"></i>Account</h5>
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-danger" id="pageSignOutBtn">
                            <i class="fas fa-sign-out-alt me-2"></i>Sign Out
                        </button>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="col-md-8">
                <div class="activity-card">
                    <h5 class="fw-bold mb-3"><i class="fas fa-history me-2 text-primary"></i>Recent Activity</h5>
                    <div id="pageUsageHistoryList" class="list-group list-group-flush">
                        <div class="text-center text-muted py-4">Loading activity...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLb8Fcl_Yqqd0EYXciu5wbrAj7-mz1o9M",
            authDomain: "officetools-629fc.firebaseapp.com",
            databaseURL: "https://officetools-629fc-default-rtdb.firebaseio.com",
            projectId: "officetools-629fc",
            storageBucket: "officetools-629fc.firebasestorage.app",
            messagingSenderId: "888485297465",
            appId: "1:888485297465:web:f832733b7b78d361067ce8",
            measurementId: "G-8QE15667LC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const photoEl = document.getElementById('profilePagePhoto');
        const nameEl = document.getElementById('profilePageName');
        const emailEl = document.getElementById('profilePageEmail');
        const historyList = document.getElementById('pageUsageHistoryList');
        const signOutBtn = document.getElementById('pageSignOutBtn');

        // Sign Out Logic
        signOutBtn.addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = 'index.html');
        });

        // Load Activity
        function loadActivity() {
            const history = JSON.parse(localStorage.getItem('toolUsageHistory') || '[]');
            historyList.innerHTML = '';

            if (history.length === 0) {
                historyList.innerHTML = '<div class="text-center text-muted py-4">No recent activity found.</div>';
                return;
            }

            // sort by newest
            history.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            history.forEach(item => {
                const date = new Date(item.timestamp);
                const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                const timeStr = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

                const div = document.createElement('div');
                div.className = 'list-group-item d-flex justify-content-between align-items-center py-3 border-bottom';
                div.innerHTML = `
                    <div>
                        <div class="fw-semibold">${item.toolName}</div>
                        <small class="text-muted"><i class="far fa-clock me-1"></i>${dateStr} at ${timeStr}</small>
                    </div>
                    <span class="material-symbols-outlined text-muted" style="font-size: 1.2rem;">history</span>
                `;
                historyList.appendChild(div);
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                photoEl.src = user.photoURL || './Assets/icons/icon-256x256.png';
                nameEl.textContent = user.displayName || 'User';
                emailEl.textContent = user.email || '';
                loadActivity();
            } else {
                window.location.href = 'index.html'; // Redirect if not logged in
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
